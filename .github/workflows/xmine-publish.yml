# Публикация форка ValioBungee (RedisBungee) в свой Reposilite, раздел-кандидат
# пары форков `fork-snapshot` (вики, ADR-0056). Координата
# ru.xmine.thirdparty:valiobungee-velocity, потребитель - VelocityServer
# (plugins.yml). Закрепляться там можно только на сборку с `xmine/main` (вики,
# ADR-0060); с фичевых веток `xmine/**` сборка тоже публикуется - для проверки
# на стенде.
#
# Что в форке изменено: подстановка переменных среды в config.yml (голый
# `${VAR}` / `${VAR:-default}`, см. ConfigLoader).
#
# ЭТОТ РЕПОЗИТОРИЙ ПУБЛИЧНЫЙ, поэтому `runs-on` здесь — только раннеры GitHub и
# никогда `self-hosted`. Правило записано в вики (infra/ci.md, «Граница
# безопасности: только приватные репозитории»), обе группы раннеров организации
# имеют allows_public_repositories=false. Причина в том, что PR из чужого форка
# исполняет workflow ИЗ САМОГО PR, то есть автор форка волен дописать
# `runs-on: self-hosted` и получить исполнение своего кода на хосте, где
# работает игровой сервер.
#
# Отсюда же остальные меры: триггера `pull_request` нет вовсе, push ограничен
# нашими ветками, а job не запускается в форках самого форка.
#
# JAVA 21, А НЕ 25 — И ЭТО НЕ НЕДОСМОТР.
#
# Обёртка апстрима — Gradle 8.10.1 (gradle/wrapper/gradle-wrapper.properties),
# он понимает Java максимум 23; на JDK 25 сборка падает сразу, ещё до
# конфигурации, сообщением вида «* What went wrong: 25.0.3». Сверх того
# `com.github.johnrengelman.shadow` 8.1.1 несовместим с Gradle 9, так что
# «просто поднять обёртку» — тоже не однострочник. Проверено на JDK 21: сборка
# и shadowJar проходят. Если поднимаете Java здесь — сначала поднимите Gradle
# и замените shadow-плагин, иначе сломаете публикацию.
#
# Целевая среда от этого не страдает: прокси XMine работает на Velocity 4.1.1
# под Java 25, а плагин компилируется с `options.release = 17`, то есть байткод
# 17-й версии на 25-й JVM грузится штатно (проверено локальным запуском
# velocity-4.1.1-24 с этим jar).

name: XMine - publish ValioBungee (Velocity)

on:
  push:
    branches: ['xmine/**']
  workflow_dispatch:

# Публикация не должна идти в два потока: параллельные сборки означали бы гонку
# за то, чья попадёт под координату.
concurrency:
  group: xmine-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Апстримная версия - единственное, что здесь задаётся руками: из git её не
  # вывести, она говорит, поверх какого релиза сделан форк (version в
  # gradle.properties). Меняется при перебазировании на новый апстрим, а не при
  # каждой нашей правке.
  #
  # Остальное считает шаг «Версия» ниже: <апстрим>-<ветка>-<ГГГГ-ММ-ДД>-<хеш>.
  UPSTREAM_VERSION: "0.12.5"
  MAVEN_GROUP_PATH: ru/xmine/thirdparty
  MAVEN_ARTIFACT: valiobungee-velocity
  # Раздел-кандидат пары форков, а не third-party: third-party - зеркало ЧУЖИХ
  # артефактов, а сборку форка правим и собираем мы, поэтому у неё есть стадия.
  MAVEN_SECTION: fork-snapshot

jobs:
  publish:
    # Форки самого форка не должны пытаться публиковать в наш Reposilite.
    if: github.repository == 'XMineServer/ValioBungee'
    runs-on: ubuntu-latest

    env:
      XMINE_MAVEN_USERNAME: ${{ secrets.XMINE_MAVEN_USERNAME }}
      XMINE_MAVEN_PASSWORD: ${{ secrets.XMINE_MAVEN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # api/build.gradle.kts зовёт `git rev-parse HEAD` через blossom,
          # на клоне без истории это не отработает.
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Версия
        # Считается из коммита, а не берётся из константы: координата обязана
        # различать сборки. `/` в имени ветки заменяется на `-` - в версии Maven
        # это разделитель пути в раскладке репозитория, и артефакт уехал бы не туда.
        run: |
          set -eu
          branch=$(printf '%s' "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9.' '-' | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          read -r cdate chash < <(git log -1 --format='%cs %h')
          echo "XMINE_VERSION=${UPSTREAM_VERSION}-${branch}-${cdate}-${chash}" >> "$GITHUB_ENV"

      - name: Fail early without credentials
        run: |
          set -eu
          if [ -z "${XMINE_MAVEN_USERNAME:-}" ] || [ -z "${XMINE_MAVEN_PASSWORD:-}" ]; then
            echo "::error::Secrets XMINE_MAVEN_USERNAME / XMINE_MAVEN_PASSWORD are not set"
            exit 1
          fi

      - name: Занята ли координата
        id: exists
        # Координата неизменяема, поэтому «уже опубликовано» - законный ответ, а не
        # ошибка. Коды различаются намеренно: 404 - публиковать, 200 - пропустить,
        # всё остальное - падать. 401 при неверном имени секрета иначе выглядел бы
        # как «артефакта нет». Проверка обязательна ещё и потому, что
        # `redeployment: false` в Reposilite не держит перезапись (вики,
        # infra/known-issues.md): повторная сборка того же коммита иначе
        # перезаписала бы jar другим sha256.
        run: |
          set -eu
          BASE="https://maven.xmine.world/${MAVEN_SECTION}/${MAVEN_GROUP_PATH}/${MAVEN_ARTIFACT}/${XMINE_VERSION}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
                   --user "${XMINE_MAVEN_USERNAME}:${XMINE_MAVEN_PASSWORD}" \
                   "${BASE}/${MAVEN_ARTIFACT}-${XMINE_VERSION}.pom")
          case "$CODE" in
            404) echo "found=false" >> "$GITHUB_OUTPUT"; echo "Публикуем ${XMINE_VERSION}" ;;
            200) echo "found=true"  >> "$GITHUB_OUTPUT"
                 echo "${XMINE_VERSION} уже в разделе ${MAVEN_SECTION} - собирать нечего" ;;
            *)   echo "::error::${BASE} ответил $CODE - это не «есть» и не «нет»"; exit 1 ;;
          esac

      - name: Build shadow jar
        if: steps.exists.outputs.found == 'false'
        run: ./gradlew :RedisBungee-Proxy-Velocity:shadowJar -PxmineVersion="${XMINE_VERSION}" --stacktrace

      - name: Publish to Reposilite
        if: steps.exists.outputs.found == 'false'
        # maven-publish кладёт рядом с jar сгенерированный pom - без него координата
        # неполна, и резолвер на той стороне спотыкается.
        run: |
          XMINE_MAVEN_URL="https://maven.xmine.world/${MAVEN_SECTION}" \
            ./gradlew :RedisBungee-Proxy-Velocity:publishXmineForkPublicationToXmineRepository \
            -PxmineVersion="${XMINE_VERSION}" --stacktrace

      - name: Verify the way VelocityServer will fetch it
        if: steps.exists.outputs.found == 'false'
        # Сверка идёт ровно тем путём, которым пойдёт сборка образа: качаем по прямому
        # адресу и сличаем хеш. Без этого «опубликовано» означает лишь «сервер ответил 2xx».
        run: |
          set -eu
          BASE="https://maven.xmine.world/${MAVEN_SECTION}/${MAVEN_GROUP_PATH}/${MAVEN_ARTIFACT}/${XMINE_VERSION}"
          curl --fail-with-body --silent --show-error \
               --user "${XMINE_MAVEN_USERNAME}:${XMINE_MAVEN_PASSWORD}" \
               -o /tmp/roundtrip.jar "${BASE}/${MAVEN_ARTIFACT}-${XMINE_VERSION}.jar"

          JAR="proxies/velocity/build/libs/RedisBungee-Proxy-Velocity-${XMINE_VERSION}-all.jar"
          LOCAL="$(sha256sum "${JAR}" | cut -d' ' -f1)"
          REMOTE="$(sha256sum /tmp/roundtrip.jar | cut -d' ' -f1)"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::Round-trip mismatch: local $LOCAL, published $REMOTE"
            exit 1
          fi

          {
            echo "### Published"
            echo '```'
            echo "$(echo "${MAVEN_GROUP_PATH}" | tr '/' '.'):${MAVEN_ARTIFACT}:${XMINE_VERSION}"
            echo "repo:        ${MAVEN_SECTION}"
            echo "sha256:      ${LOCAL}"
            echo "base commit: ${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Уже опубликовано
        if: steps.exists.outputs.found == 'true'
        run: |
          {
            echo "### Ничего не публиковалось"
            echo
            echo "\`${XMINE_VERSION}\` уже лежит в разделе \`${MAVEN_SECTION}\`:"
            echo "входы этой сборки с прошлой публикации не менялись."
          } >> "$GITHUB_STEP_SUMMARY"
